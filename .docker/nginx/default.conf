map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

# -rbauerMod3- Redirects 127.0.0.1 to the canonical https://localhost origin.
#
# For a browser 127.0.0.1 and localhost are two different origins, so they have
# separate cookie jars. The SameSite=Lax auth cookies set by localhost are not
# sent from a 127.0.0.1 page, which caused a 401 / redirect-to-login loop. One
# canonical origin means one cookie jar.
#
# The certificate is repeated here because TLS completes before nginx can read
# the Host header: the browser validates a cert for 127.0.0.1 before receiving
# the 301, hence the SAN issued by the Makefile.
#
# `$request_uri` (not `$uri`) preserves the query string.
server {
    listen 80;
    listen 443 ssl;
    server_name 127.0.0.1;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    return 301 https://localhost$request_uri;
}

server {
    # -rbauerMod3- `default_server` = this block answers any HTTPS request whose
    # Host matches no `server_name` here.
    #
    # Without it nginx defaults to the first `listen 443` block, i.e. the
    # 127.0.0.1 redirect above: a request using the LAN address would get
    # "301 -> https://localhost", making the app unreachable from other machines.
    # Declaring it explicitly avoids depending on block order in this file.
    listen 443 ssl default_server;
    server_name localhost;

#IF GIT-IGNORED WHEN PUSH DO WE STILL HAVE TO ADD THEM HERE ?
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    client_max_body_size 3M;

    # WebSocket / Socket.IO vers backend
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Routes HTTP du backend
    location ~ ^/(auth|users|friends|conversations|lobby)(/|$) {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploads avatars servis par le backend
    location /uploads/avatars/ {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tout le reste va au frontend Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}




